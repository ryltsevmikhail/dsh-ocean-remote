# Standalone private node. No host ports; do not merge with another Compose file.
name: dsh-ocean-remote-test
services:
  tailscale:
    image: ${DSH_TAILSCALE_IMAGE:?Set DSH_TAILSCALE_IMAGE to the downloaded official image digest}
    pull_policy: never
    hostname: ${DSH_OCEAN_NODE_NAME:-ocean-remote-test}
    networks:
      - backend
      - transport
    environment:
      TS_HOSTNAME: ${DSH_OCEAN_NODE_NAME:-ocean-remote-test}
      TS_USERSPACE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_KUBE_SECRET: ""
      TS_AUTH_ONCE: "true"
      TS_ACCEPT_DNS: "false"
      TS_BOOT_TIMEOUT: 30m
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailnet-state:/var/lib/tailscale
      - type: bind
        source: ./tailscale-serve.json
        target: /config/serve.json
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  server:
    image: ${DSH_OCEAN_IMAGE:?Set DSH_OCEAN_IMAGE to a locally built and verified image}
    pull_policy: never
    networks:
      - backend
    environment:
      DSH_SERVER_HOST: 0.0.0.0
      DSH_SERVER_PORT: "8080"
      DSH_SERVER_DATA_FILE: /data/state.json
      DSH_SERVER_ACCOUNT: ${DSH_SERVER_ACCOUNT:?Set DSH_SERVER_ACCOUNT}
      DSH_SERVER_PASSWORD: ${DSH_SERVER_PASSWORD:?Set DSH_SERVER_PASSWORD}
      DSH_SERVER_PUBLIC_URL: ${DSH_SERVER_PUBLIC_URL:?Set the separate node's HTTPS origin}
    volumes:
      - server-data:/data
    restart: unless-stopped
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  server-data:
  tailnet-state:
networks:
  transport:
    driver: bridge
  backend:
    driver: bridge
    enable_ipv6: false
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
