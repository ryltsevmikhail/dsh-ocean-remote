# Standalone configuration; do not merge with compose.yaml.
name: dsh-ocean-remote
services:
  server:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    environment:
      DSH_SERVER_HOST: 0.0.0.0
      DSH_SERVER_PORT: "8080"
      DSH_SERVER_DATA_FILE: /data/state.json
      DSH_SERVER_ACCOUNT: ${DSH_SERVER_ACCOUNT:?Set DSH_SERVER_ACCOUNT in .env}
      DSH_SERVER_PASSWORD: ${DSH_SERVER_PASSWORD:?Set DSH_SERVER_PASSWORD in .env}
      DSH_SERVER_PUBLIC_URL: https://${DSH_REMOTE_DOMAIN:?Set DSH_REMOTE_DOMAIN in .env}
    volumes:
      - server-data:/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  proxy:
    image: caddy:2-alpine
    environment:
      DSH_REMOTE_DOMAIN: ${DSH_REMOTE_DOMAIN:?Set DSH_REMOTE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  server-data:
  caddy-data:
  caddy-config:
